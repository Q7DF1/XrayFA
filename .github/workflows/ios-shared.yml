name: iOS Shared Compile CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "feat/**"]

jobs:
  domain-ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Run domain commonTest on iOS simulator
        run: |
          chmod +x gradlew
          ./gradlew :domain:iosSimulatorArm64Test --no-daemon

  compile-ios-shared:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Cache LibXrayLite.xcframework
        id: xcframework
        uses: actions/cache@v4
        with:
          path: AndroidLibXrayLite/LibXrayLite.xcframework
          key: libxray-ios-${{ hashFiles('AndroidLibXrayLite/go.mod', 'AndroidLibXrayLite/go.sum', 'scripts/build_libxray_ios.sh') }}

      - name: Set up Go
        if: steps.xcframework.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5.4.0
        with:
          go-version-file: ./AndroidLibXrayLite/go.mod

      - name: Install gomobile
        if: steps.xcframework.outputs.cache-hit != 'true'
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init

      - name: Build LibXrayLite.xcframework
        if: steps.xcframework.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_libxray_ios.sh
          ./scripts/build_libxray_ios.sh

      - name: Compile shared iOS targets
        run: |
          chmod +x gradlew
          ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon
