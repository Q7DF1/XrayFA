name: iOS Shared Compile CI

on:
  push:
    branches: ["main", "feat/migrateToKMP"]
  pull_request:
    branches: ["main", "feat/migrateToKMP"]

jobs:
  compile-ios-shared:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Compile shared iOS targets
        run: |
          chmod +x gradlew
          ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon
