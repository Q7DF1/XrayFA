# F-Droid Release CI - Automatically triggered on push to main or tag (v*)
# Builds APK with package name from APPLICATION_ID in gradle.properties
name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: 
    - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # Required permission to create a GitHub Release
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode keystore
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/xrayfa.jks
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    - name: Setup Golang
      uses: actions/setup-go@v5.4.0
      with:
        go-version-file: './AndroidLibXrayLite/go.mod'

    - name: Setup EXACT NDK for Reproducibility
      run: |
        wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
        unzip -q android-ndk.zip
        rm android-ndk.zip

        echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-r28c" >> $GITHUB_ENV

    - name: Initialize Build Directory
      run: |
        sudo mkdir -p /home/vagrant/build/com.android.xrayfa
        sudo chown -R $USER:$USER /home/vagrant
        cp -a . /home/vagrant/build/com.android.xrayfa/

    - name: Prepare native AAR
      working-directory: /home/vagrant/build/com.android.xrayfa
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      run: |
        bash scripts/fdroid.sh prebuild
        bash scripts/fdroid.sh bind
    - name: Grant execute permission for gradlew
      working-directory: /home/vagrant/build/com.android.xrayfa
      run: chmod +x gradlew
    - name: Run unit tests
      working-directory: /home/vagrant/build/com.android.xrayfa
      run: ./gradlew test --max-workers=1 --no-daemon
    - name: Build with Gradle
      working-directory: /home/vagrant/build/com.android.xrayfa
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease --max-workers=1 --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: /home/vagrant/build/com.android.xrayfa/androidApp/build/outputs/apk/release/*.apk

# Auto-release step
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') # Only execute this step if triggered by a tag push
      with:
        files: /home/vagrant/build/com.android.xrayfa/androidApp/build/outputs/apk/release/*.apk # Directly use the path of the built APK
        generate_release_notes: true # Automatically generate release notes from PRs/commits
