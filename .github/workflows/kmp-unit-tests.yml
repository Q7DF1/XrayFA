# JVM unit tests for KMP shared modules (no gomobile / NDK / xcframework).
# Release APK builds stay in android.yml on main/tags only.
name: KMP Unit Tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "feat/**"]

jobs:
  jvm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Run shared-module unit tests
        run: |
          chmod +x gradlew
          ./gradlew \
            :common:testDebugUnitTest \
            :domain:testDebugUnitTest \
            :core:datastore:testDebugUnitTest \
            :core:data:compileDebugKotlinAndroid \
            --no-daemon

  linux-cli-model-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Test CLI models and temporary-file adapters (no core or network changes)
        run: |
          chmod +x gradlew
          ./gradlew -PenableLinuxCli=true \
            :linux:cli:jvmTest \
            :linux:cli:linuxX64Test \
            --no-daemon
