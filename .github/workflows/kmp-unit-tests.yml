# JVM unit tests for KMP shared modules (no gomobile / NDK / xcframework).
# Release APK builds stay in android.yml on main/tags only.
name: KMP Unit Tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "feat/**"]

jobs:
  jvm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Run shared-module unit tests
        run: |
          chmod +x gradlew
          ./gradlew \
            :common:testDebugUnitTest \
            :domain:testDebugUnitTest \
            :core:datastore:testDebugUnitTest \
            --no-daemon
