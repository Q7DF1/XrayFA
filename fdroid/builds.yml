# Paste these Builds entries into fdroiddata `metadata/com.android.xrayfa.yml`
# under `Builds:`. Keep AutoUpdateMode / VercodeOperation / UpdateCheckData /
# AllowedAPKSigningKeys as they are. After this lands, do not duplicate geo /
# gomobile / ABI sed in fdroiddata — change `scripts/fdroid.sh` in this repo.
#
# Replace COMMIT with the git tag of the release (v1.7.1).
# versionCode 35001..35004 = VERSION_CODE 35 * 1000 + ABI index.

  - versionName: 1.7.1
    versionCode: 35001
    commit: COMMIT
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev make
      - apt-get install -y -t trixie-backports golang-go
    gradle:
      - yes
    output: androidApp/build/outputs/apk/release/XrayFA-armeabi-v7a-release-unsigned.apk
    binary: https://github.com/Q7DF1/XrayFA/releases/download/v%v/XrayFA-armeabi-v7a-release.apk
    srclibs:
      - go@go1.26.2
    prebuild:
      - bash scripts/fdroid.sh prebuild armeabi-v7a
    build:
      - bash scripts/fdroid.sh bind armeabi-v7a $$go$$
    ndk: r28c

